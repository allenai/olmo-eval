server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location ^~ /api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Asset-like requests (anything with a file extension) must resolve to a
  # real file or return a 404 — never fall back to index.html, which would
  # serve a cacheable 200 for a missing asset.
  location ~* \.[^/]+$ {
    try_files $uri =404;
  }

  # SPA routes (no file extension) fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
