name: Dashboard CI
on:
    pull_request:
        branches: [main]
        paths:
            - dashboard/**
            - infra/terraform/**
            - .github/workflows/dashboard-ci.yml
    push:
        branches: [main]
        paths:
            - dashboard/**
            - infra/terraform/**
            - .github/workflows/dashboard-ci.yml

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    api:
        name: API
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: dashboard/api
        services:
            postgres:
                # Matches the Cloud SQL major version in infra/terraform/cloudsql.tf.
                image: postgres:17
                env:
                    POSTGRES_USER: olmo
                    # Throwaway CI database, so no password.
                    POSTGRES_HOST_AUTH_METHOD: trust
                    POSTGRES_DB: olmo_eval_test
                ports: ["5432:5432"]
                options: >-
                    --health-cmd "pg_isready -U olmo" --health-interval 5s
                    --health-timeout 5s --health-retries 20
        env:
            TEST_DATABASE_URL: postgresql+asyncpg://olmo@localhost:5432/olmo_eval_test
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v7
              with:
                  python-version: "3.12"
                  enable-cache: true
                  cache-dependency-glob: dashboard/api/uv.lock
            - run: uv sync --locked
            - run: uv run ruff check .
            - run: uv run ruff format --check .
            - run: uv run ty check
            - run: uv run pytest

    ui:
        name: UI
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: dashboard/ui
        steps:
            - uses: actions/checkout@v6
            - name: Check that licensed font files are not committed
              working-directory: .
              run: |
                  files="$(git ls-files 'dashboard/ui/public/fonts/*' '*.otf')"
                  if [ -n "$files" ]; then
                      echo "Licensed font files must not be committed:"
                      echo "$files"
                      exit 1
                  fi
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: dashboard/ui/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run test
            - run: npm run contract:check
            - run: npm run build

    terraform:
        name: Terraform
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: infra/terraform
        steps:
            - uses: actions/checkout@v6
            - uses: hashicorp/setup-terraform@v4
              with:
                  terraform_version: "1.16.x"
            - run: terraform fmt -check -recursive
            - run: terraform init -backend=false -input=false
            - run: terraform validate
