version: v2
description: >-
  One-H100 urgent aggregation of the complete 60-prompt Nemotron-3-Super
  BF16 router and routed/shared expert-contribution profile.
tasks:
  - name: aggregate
    image:
      beaker: 01KVTNKQXYACY9J3HEE265KJXA
    command: [/bin/bash, -lc]
    arguments:
      - >-
        UV_CACHE_DIR=/weka/oe-eval-default/olmo-eval-pypi-cache
        uv pip install --python /opt/venv/bin/python "matplotlib>=3.8" &&
        /opt/venv/bin/python
        /weka/oe-adapt-default/jacobm/olmoe3/adaptive-compute/olmo-eval/scripts/adaptive_experts/aggregate_nemotron_router_contributions.py
        --input
        /weka/oe-adapt-default/jacobm/olmoe3/adaptive-compute/olmo-eval/results/adaptive_experts/01KXSHV17C9FDKBWTWHKG694RG/shard-0
        --input
        /weka/oe-adapt-default/jacobm/olmoe3/adaptive-compute/olmo-eval/results/adaptive_experts/01KXSHV17C9FDKBWTWHKG694RG/shard-1
        --input
        /weka/oe-adapt-default/jacobm/olmoe3/adaptive-compute/olmo-eval/results/adaptive_experts/01KXSJTPF0PYN3B6MMNW56FTCF/shard-2
        --input
        /weka/oe-adapt-default/jacobm/olmoe3/adaptive-compute/olmo-eval/results/adaptive_experts/01KXSHV17C9FDKBWTWHKG694RG/shard-3
        --qwen-summary
        /weka/oe-adapt-default/jacobm/olmoe3/adaptive-compute/olmo-eval/notes/expert_contribution/qwen3_k8_expert_contribution_summary.json
        --output /results
    datasets:
      - mountPath: /weka/oe-adapt-default
        source:
          weka: oe-adapt-default
      - mountPath: /weka/oe-eval-default
        source:
          weka: oe-eval-default
    result:
      path: /results
    resources:
      cpuCount: 8
      gpuCount: 1
      memory: 32 GiB
      sharedMemory: 1 GiB
    context:
      priority: urgent
      minRuntime: 0s
      autoResume: true
    constraints:
      cluster:
        - ai2/jupiter
    hostNetworking: false
    propagateFailure: false
    propagatePreemption: false
    timeout: 2h0m0s
