version: v2
description: >-
  Four-B200 full Qwen3.5 native-K=8 router concentration and routed/shared
  expert contribution profile over 20 stratified prompts from each of MATH-500,
  GPQA, and IFEval OOD.
tasks:
  - name: profile
    image:
      beaker: 01KVTPSG86RYVXV13FGQDM9GXT
    command: [/bin/bash, -lc]
    arguments:
      - >-
        set -euo pipefail;
        UV_CACHE_DIR=/weka/oe-eval-default/olmo-eval-pypi-cache
        uv pip install --python /opt/venv/bin/python
        "transformers==5.7.0" "accelerate>=1.0" &&
        /opt/venv/bin/torchrun
        --standalone
        --nproc-per-node=4
        /weka/oe-adapt-default/jacobm/olmoe3/adaptive-compute/olmo-eval/scripts/adaptive_experts/qwen35_hybrid_router_shared_profile.py
        --model Qwen/Qwen3.5-35B-A3B
        --manifest /weka/oe-adapt-default/jacobm/olmoe3/adaptive-compute/olmo-eval/notes/router_profile/qwen35_k8_manifest.jsonl
        --output /results
        --max-new-tokens 32768
        --validation-tokens 16
        --distributed-timeout-hours 48
    envVars:
      - name: HF_HOME
        value: /weka/oe-eval-default/oyvindt/hf-cache
      - name: HF_HUB_CACHE
        value: /weka/oe-eval-default/oyvindt/hf-cache
      - name: HF_TOKEN
        secret: jacobm_HF_TOKEN
      - name: PYTORCH_ALLOC_CONF
        value: expandable_segments:True
      - name: OMP_NUM_THREADS
        value: "8"
    datasets:
      - mountPath: /weka/oe-adapt-default
        source:
          weka: oe-adapt-default
      - mountPath: /weka/oe-eval-default
        source:
          weka: oe-eval-default
    result:
      path: /results
    resources:
      cpuCount: 64
      gpuCount: 4
      memory: 500 GiB
      sharedMemory: 64 GiB
    context:
      priority: urgent
      minRuntime: 0s
      autoResume: true
    constraints:
      cluster:
        - ai2/titan
    hostNetworking: false
    propagateFailure: false
    propagatePreemption: false
    timeout: 72h0m0s
