eval = "ExpertQA"
status = "unsupported"
reason = "No validated ExpertQA tool-harness profile"
verified = true

[[flags]]
model = "OLMo-3 7B Instruct"
eval = "ExpertQA"
status = "unsupported"
reason = "No validated ExpertQA tool-harness profile"
