# Static metadata for the sci-lit eval sweep summary.
#
# Transcribed from the "SciLit Eval Matrix" sheet's two reference tabs, plus the
# things the sheet cannot express: the sci-lit vs sentinel split, display
# ordering, and suspect-run flags.
#
# The results CSV is refetched; this file is hand-maintained.

[evals.ExpertQA]
ref = "expertqa"
family = "sci-lit"
why = "fixed dev100 attributed QA; grounded scientific writing quality"

[evals."LitSearch-open"]
ref = "litsearch"
family = "sci-lit"
why = "fixed dev50 live retrieval; end-to-end paper search against the real S2 API"

[evals."LitSearch-rerank"]
ref = "litsearch_rerank"
family = "sci-lit"
why = "fixed-corpus reranking; reproducible, judge-free measure of paper relevance ranking"

[evals."SAGE-open"]
ref = "sage_open_ended"
family = "sci-lit"
why = "fixed dev50 multi-paper retrieval; breadth of literature awareness"

[evals."SAGE-short"]
ref = "sage_short_form"
family = "sci-lit"
why = "fixed dev50 single-paper identification; precision of targeted lookup"

[evals."DeepScholar-Bench"]
ref = "deepscholar_bench"
family = "sci-lit"
why = "fixed dev10 related-work generation; end-to-end research synthesis"

[evals."FS-Olympiad accuracy"]
ref = "frontierscience_olympiad"
family = "frontier-science"
why = "accuracy over 100 closed-form Olympiad-level biology, chemistry, and physics questions"

[evals."FS-Research success"]
ref = "frontierscience_research"
family = "frontier-science"
why = "hard success rate over 60 open-ended research questions"

[evals."FS-Research rubric"]
ref = "frontierscience_research"
family = "frontier-science"
why = "partial-credit rubric score over the same 60 open-ended research questions"

[evals.IFEval]
ref = "ifeval_ood"
family = "sentinel"
why = "monitors instruction-following hasn't degraded during domain post-training"

[evals.MMLU]
ref = "mmlu"
family = "sentinel"
why = "monitors broad knowledge retention after post-training"

[evals."MATH-500"]
ref = "math500"
family = "sentinel"
why = "monitors reasoning capability hasn't been hurt by domain specialization"


